
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030c18">

  <title>DARTIQ | Stop Guessing. Start Improving.</title>
  <meta name="description" content="DARTIQ intelligent darts coaching. Identify weaknesses, understand performance, and train with purpose.">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #030c18;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px 48px;
      background:
        radial-gradient(
          ellipse at 50% 70%,
          rgba(39, 184, 255, 0.12),
          transparent 65%
        ),
        #030c18;
    }

    .hero-image {
      display: block;
      width: 100%;
      max-width: 1500px;
      height: auto;
      border-radius: 12px;
    }

    .vip-area {
      text-align: center;
      margin-top: 12px;
    }

    .vip-button {
      display: inline-block;
      padding: 18px 42px;
      background: linear-gradient(
        180deg,
        #70eaff,
        #27b8ff 60%,
        #0788dc
      );
      color: #03101d;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-decoration: none;
      border: 1px solid #a4f3ff;
      border-radius: 12px;
      box-shadow:
        0 0 16px rgba(39,184,255,0.65),
        0 0 40px rgba(39,184,255,0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .vip-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 0 24px rgba(39,184,255,0.85),
        0 0 55px rgba(39,184,255,0.4);
    }

    .vip-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .vip-button.closed {
      background: #34495e;
      color: #d0dbe5;
      border-color: #526779;
      box-shadow: none;
      cursor: default;
    }

    .vip-note {
      color: #b9cde0;
      font-size: 14px;
      margin-top: 18px;
    }

    @media (max-width: 768px) {
      .hero {
        padding: 20px 10px 40px;
      }

      .hero-image {
        border-radius: 6px;
      }

      .vip-area {
        width: 100%;
        margin-top: 24px;
      }

      .vip-button {
        width: min(100%, 360px);
        padding: 17px 20px;
        font-size: 16px;
      }

      .vip-note {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <img
      class="hero-image"
      src="Slimmer%20darten%20met%20DARTIQ-coaching.png"
      alt="DARTIQ - Stop Guessing. Start Improving. Identify weaknesses, understand your performance, and train with purpose."
      fetchpriority="high"
    >

    <div class="vip-area">

      <a
        id="vipButton"
        class="vip-button"
        href="https://coach1979christian-coder.github.io/dartiq-web/dartiq-vip-register.html"
      >
        VIP EARLY ACCESS
      </a>

      <p class="vip-note" id="vipNote">
        7-day free trial. No payment details required.
      </p>

    </div>

  </main>

  <script>
    // VIP registration closes at the end of December 1,
    // 2026 in Belgian local time.
    const belgianDate = new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Europe/Brussels",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).format(new Date());

    const closingDate = "2026-12-01";

    if (belgianDate > closingDate) {
      const button = document.getElementById("vipButton");
      const note = document.getElementById("vipNote");

      button.removeAttribute("href");
      button.classList.add("closed");
      button.textContent = "VIP REGISTRATION CLOSED";

      note.textContent =
        "VIP Founder registration has ended.";
    }
  </script>

</body>
</html>
